# ── 外观 ─────────────────────────────────────────────────────────────────────

# 头像 URL（支持本地路径或远程图片链接）
avatar: 'https://i.ibb.co/LXPy8SbJ/unnamed.jpg'

# 默认语言：zh（中文）| en（英文）
