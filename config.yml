# 默认主题：system（跟随系统）| light（浅色）| dark（深色）
theme: dark

# ── 主题预设 ──────────────────────────────────────────────────────────────────
# 可选值：dashboard（3.0 Dashboard 风格）| classic（旧版多页面风格）| 自定义主题名
# 自定义主题：在 src/themes/<name>/ 下创建主题，并在 src/App.tsx 注册后填写对应名称
theme_preset: dashboard

